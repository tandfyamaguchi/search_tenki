<!--Noを選択すると、検索結果を表示する-->
{% extends "search/base.html" %}
{% load static %}
{% block extra_css %}
    <!-- 年度・号選択画面用のCSSを読み込む。 -->
    <link rel="stylesheet" href="{% static 'search/css/browse.css' %}">
{% endblock extra_css %}
{% block content %}
    <h2>号を選択してください。</h2>
    検索条件:「{{vol}}巻（{{year}}年）」
    <div class="d-flex flex-row flex-wrap">
            {% for m in list %}
                {% if m.no == 13 %}
                    <a type="button" class="btn btn-outline-dark browse-link browse-link--issue" href="{% url 'list:ShowList1' id=m.id %}">特別号</a>
                {% else %}
                    <a type="button" class="btn btn-outline-dark browse-link browse-link--issue" href="{% url 'list:ShowList1' id=m.id %}"><b>No.{{m.no}}</b><br>page:{{m.start_page}} -
                    </a>
                {% endif %}
            {% endfor %}
        </div>
    </div>    
{% endblock content %}
